<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">

    <meta name="syncboard-ui-release" content="tc445-shell-1">
    <link rel="icon" type="image/svg+xml" href="assets/brand-v2/favicon.svg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);

        .dark .glass-panel {
            background: rgba(39, 55, 77, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .pattern-grid {
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'custom-darkest': '#27374D',
                        'custom-header': '#28344c',
                        'custom-dark': '#526D82',
                        'custom-medium': '#9DB2BF',
                        'custom-light': '#DDE6ED',
                        'base-white': '#FFFFFF',
                        'base-bg': '#F9FAFB',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/fluxo-v2.css?v=tc445-shell-1">
    <link rel="stylesheet" href="css/login-v2.css?v=tc445-shell-1">
</head>
<body class="sb-scope sb-login" data-ui-release="tc445-shell-1">
    <section class="sb-login-story" aria-label="SyncBoard NT">
      <img src="assets/brand-v2/logo-primary-dark.svg" class="sb-login-logo" alt="SyncBoard NT" width="222" height="48">
      <div><img src="assets/brand-v2/mark-primary.svg" class="sb-login-mark" alt="" width="96" height="96"><h2>Seu trabalho.<br><span>Em sintonia.</span></h2><p>Organize tarefas, acompanhe cada etapa e mantenha sua equipe alinhada.</p></div>
      <small>SyncBoard NT · Clareza em cada etapa.</small>
    </section>
    <main class="sb-login-access">
      <button type="button" id="theme-toggle" class="sb-button sb-button--secondary sb-login-theme" aria-label="Alternar tema"><i id="theme-icon" data-lucide="moon" style="width:18px;height:18px" aria-hidden="true"></i><span>Tema</span></button>
      <section class="sb-panel" aria-labelledby="login-heading">
        <img src="assets/brand-v2/logo-primary-light.svg" class="sb-login-mobile-brand sb-login-mobile-brand-light" alt="SyncBoard NT" width="176" height="38">
        <img src="assets/brand-v2/logo-primary-dark.svg" class="sb-login-mobile-brand sb-login-mobile-brand-dark" alt="SyncBoard NT" width="176" height="38">
        <span class="sb-badge" data-status="inprogress">Seu espaço de trabalho</span>
        <h1 id="login-heading">Bom ter você por aqui.</h1><p>Acesse sua conta para continuar no SyncBoard NT.</p>
        <a href="/.auth/login/google?post_login_redirect_uri=/" class="sb-button sb-login-button">                    <svg class="w-6 h-6" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
<span>Entrar com Google</span></a>
        <p class="sb-login-note">Acesso restrito à equipe autorizada.</p>
      </section>
    </main>
    <script>
      const themeToggle = document.getElementById('theme-toggle');
      const html = document.documentElement;
      const renderThemeIcon = () => {
        document.getElementById('theme-icon')?.setAttribute('data-lucide', html.classList.contains('dark') ? 'sun' : 'moon');
        window.lucide?.createIcons();
      };
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        html.classList.add('dark');
      } else {
        html.classList.remove('dark');
      }
      renderThemeIcon();
      themeToggle.addEventListener('click', () => {
        html.classList.toggle('dark');
        localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        renderThemeIcon();
      });
    </script>
</body></html>
