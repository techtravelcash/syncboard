<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SyncBoard</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/AoaA8WI.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass-panel {
            background: rgba(39, 55, 77, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }

        .pattern-grid {
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'custom-darkest': '#27374D',
                        'custom-header': '#28344c',
                        'custom-dark': '#526D82',
                        'custom-medium': '#9DB2BF',
                        'custom-light': '#DDE6ED',
                        'base-white': '#FFFFFF',
                        'base-bg': '#F9FAFB',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased bg-base-bg dark:bg-custom-darkest text-custom-darkest dark:text-custom-light h-screen w-full flex overflow-hidden font-sans transition-colors duration-300">

    <div class="hidden lg:flex lg:w-1/2 relative bg-custom-darkest dark:bg-[#1e2a3b] items-center justify-center overflow-hidden">
        <div class="absolute inset-0 pattern-grid opacity-30"></div>
        
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-custom-dark/30 rounded-full blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[400px] h-[400px] bg-blue-500/10 rounded-full blur-[80px]"></div>

        <div class="relative z-10 flex flex-col items-center text-center p-12 animate-fade-in">
            <div class="w-32 h-32 bg-white/10 backdrop-blur-md rounded-[30px] flex items-center justify-center mb-8 border border-white/10 shadow-2xl">
                <img src="https://i.imgur.com/AoaA8WI.png" class="w-20 h-20 object-contain drop-shadow-lg" alt="SyncBoard Logo">
            </div>
            <h1 class="text-5xl font-extrabold text-white tracking-tight mb-4 drop-shadow-sm">SyncBoard</h1>
            <p class="text-custom-medium text-lg max-w-md font-medium leading-relaxed">
                Gerencie projetos, sincronize tarefas e colabore com sua equipe em tempo real.
            </p>
        </div>
        
        <div class="absolute bottom-8 text-custom-medium/30 text-xs font-mono tracking-widest uppercase">
            v0.0.1 &bull; Build 2026
        </div>
    </div>

    <div class="w-full lg:w-1/2 flex flex-col items-center justify-center p-6 relative bg-base-bg dark:bg-custom-darkest">
        
        <button id="theme-toggle" class="absolute top-6 right-6 p-3 rounded-xl hover:bg-custom-light/50 dark:hover:bg-white/10 transition-colors text-custom-dark dark:text-gray-400">
            <i id="theme-icon" data-lucide="moon" class="w-6 h-6"></i>
        </button>

        <div class="w-full max-w-md animate-fade-in" style="animation-delay: 0.1s;">
            
            <div class="lg:hidden flex justify-center mb-8">
                <img src="https://i.imgur.com/AoaA8WI.png" class="w-16 h-16 object-contain">
            </div>

            <div class="glass-panel p-8 md:p-10 rounded-[40px] shadow-xl dark:shadow-black/20 relative overflow-hidden text-center">
                
                <div class="mb-10 text-left">
                    <h2 class="text-3xl font-bold text-custom-darkest dark:text-white mb-2">Bem-vindo!</h2>
                    <p class="text-custom-dark dark:text-custom-medium text-sm">Acesse sua conta para entrar no workspace.</p>
                </div>

                <a href="/.auth/login/google?post_login_redirect_uri=/" 
                   class="group relative flex items-center justify-center gap-3 w-full 
                          bg-white text-custom-darkest 
                          hover:bg-gray-50 hover:shadow-xl hover:-translate-y-0.5
                          active:scale-[0.98]
                          focus:outline-none focus:ring-4 focus:ring-custom-medium/30
                          font-bold py-4 px-4 rounded-2xl 
                          transition-all duration-300 shadow-lg shadow-black/10">
                    
                    <svg class="w-6 h-6" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span class="text-lg">Entrar com Google</span>
                </a>

                <div class="mt-10 pt-6 border-t border-custom-dark/10 dark:border-white/10 text-center">
                    <p class="text-xs text-custom-dark dark:text-gray-400 font-medium uppercase tracking-widest">
                        Acesso Restrito
                    </p>
                </div>
            </div>
            
            <p class="text-center text-xs text-custom-dark/40 dark:text-white/20 mt-8 font-medium">
                &copy; 2026 SyncBoard TravelCash.
            </p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        const themeIcon = document.getElementById('theme-icon');

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
            themeIcon.setAttribute('data-lucide', 'sun');
        } else {
            html.classList.remove('dark');
            themeIcon.setAttribute('data-lucide', 'moon');
        }
        lucide.createIcons();

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            themeIcon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        });
    </script>
</body>
</html>
